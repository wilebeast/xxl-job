spring.application.name=xxl-job-risk-shadow-executor
spring.main.web-application-type=none

xxl.job.admin.addresses=${XXL_JOB_ADMIN_ADDRESSES:http://xxl-job-admin.xxl-job-lab.svc.cluster.local:8080}
xxl.job.admin.timeout=3
xxl.job.executor.appname=risk-shadow-executor
xxl.job.executor.accessToken=${XXL_JOB_EXECUTOR_ACCESS_TOKEN}
xxl.job.executor.address=${XXL_JOB_EXECUTOR_ADDRESS:http://xxl-job-risk-shadow-executor.xxl-job-lab.svc.cluster.local:9999}
xxl.job.executor.port=9999
xxl.job.executor.logpath=/tmp/xxl-job/jobhandler
xxl.job.executor.logretentiondays=7
xxl.job.executor.glueenabled=false
